name: Image Scanner

on:
  workflow_dispatch:

jobs:

  image-scanner:
    runs-on: ubuntu-latest

    steps:

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend Image Scan
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: table

      # Frontend Image Scan
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: table

