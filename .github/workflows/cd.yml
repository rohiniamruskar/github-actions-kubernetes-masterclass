name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Debug CD secrets
        run: |
           if [ -z "${{ secrets.EC2_HOST }}" ]; then
             echo "EC2_HOST is EMPTY"
           else
             echo "EC2_HOST exists"
           fi

           if [ -z "${{ secrets.EC2_USER }}" ]; then
              echo "EC2_USER EMPTY"
           else
              echo "EC2_USER EXISTS"
           fi

           if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
              echo "EC2_SSH_KEY EMPTY"
           else
              echo "EC2_SSH_KEY EXISTS"
           fi

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d ~/github-actions-kubernetes-masterclass ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git ~/github-actions-kubernetes-masterclass
            fi
            cd ~/github-actions-kubernetes-masterclass
            git pull origin main
            if [ ! -f .env ]; then
              echo "ERROR: ~/github-actions-kubernetes-masterclass/.env is missing. Create it once with DOCKERHUB_USERNAME and DB credentials."
              exit 1
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f

